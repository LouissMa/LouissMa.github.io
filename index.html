<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Merry Christmas 2025</title>
  <style>
    body,html{margin:0;padding:0;height:100%;overflow:hidden;background:#000}
    canvas{display:block;width:100%;height:100%}
    .overlay{
      position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      text-align:center;color:#fff;z-index:10;pointer-events:none;font-family:Arial,sans-serif;
    }
    h1{
      font-size:4.5rem;background:linear-gradient(90deg,#ff1744,#ff9800,#ffd700,#a0ff00);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      text-shadow:0 0 30px #000;animation:glow 3s infinite;
    }
    p{font-size:1.8rem;margin:0.8rem 0;text-shadow:0 0 20px #000}
    a{color:#ffd700;font-weight:bold}
    @keyframes glow{0%,100%{opacity:.9}50%{opacity:1}}
    @media(max-width:768px){h1{font-size:3rem}p{font-size:1.4rem}}
  </style>
</head>
<body>
  <!-- 加载你的3D动画 -->

  <!-- 圣诞文字浮层 -->

    <p>Hi，我是 @mabingnan</p>
    <p><a href="https://github.com/mabingnan">GitHub</a> • <a href="https://twitter.com/mabingnan_V">X</a></p>
    <p>Wish you a warm & snowy Christmas ❄️✨</p>
  </div>
</body>
</html>
